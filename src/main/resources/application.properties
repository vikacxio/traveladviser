spring.application.name=traveladviser

# Comma-separated browser origins allowed to call this API (required when frontend runs on another host/port).
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173

spring.datasource.url=jdbc:postgresql://localhost:5432/travel_app
spring.datasource.username=vikacxio
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.security.oauth2.client.registration.google.client-id=Abrakadabra
spring.security.oauth2.client.registration.google.client-secret=Abrakadabra
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.provider.google.issuer-uri=https://accounts.google.com

# JWT Configuration
jwt.secret=MyVeryLongAndSecureJWTSecretKeyThatIsAtLeast64CharactersLongForHS512EncryptionPurpose
jwt.expiration=86400000

