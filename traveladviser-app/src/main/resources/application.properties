spring.application.name=traveladviser

# Comma-separated browser origins allowed to call this API (required when frontend runs on another host/port).
app.cors.allowed-origins=http://localhost:4200/,http://localhost:5173,http://127.0.0.1:5173

spring.datasource.url=jdbc:postgresql://localhost:5432/travel_app
spring.datasource.username=vikacxio
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.spatial.dialect.postgis.PostgisPG10Dialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.security.oauth2.client.registration.google.client-id=Abrakadabra
spring.security.oauth2.client.registration.google.client-secret=Abrakadabra
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.provider.google.issuer-uri=https://accounts.google.com

# JWT Configuration
jwt.secret=KeyForJWTSecret
jwt.expiration=86400000

# OpenWeatherMap API Configuration
# Get your free API key from https://openweathermap.org/api
openweather.api.key=YOUR_OPENWEATHER_API_KEY
openweather.api.url=https://api.openweathermap.org/data/2.5/weather

# RestTemplate Configuration
# Connection timeout in milliseconds
rest.client.connect-timeout=5000

# Unsplash API Configuration
# Get your free API key from https://unsplash.com/oauth/applications
# Note: Free tier allows 50 requests/hour
unsplash.api.key=KeyForUnsplashAPI
unsplash.api.url=https://api.unsplash.com

# Image Storage Configuration
# Maximum image size in bytes (10MB default)
image.max-size=10485760
# Supported MIME types for upload
image.allowed-types=image/jpeg,image/png,image/webp
# Read timeout in milliseconds
rest.client.read-timeout=10000

# Wikimedia Commons API configuration
wikimedia.api.url=https://commons.wikimedia.org/w/api.php
wikimedia.user.agent=TravelAdviser/1.0/vikacio@hotmail.com

# Rate limiting configuration
rate.limit.capacity=30
rate.limit.refill-tokens=30
rate.limit.refill-period-seconds=60

app.oauth.enabled=false
