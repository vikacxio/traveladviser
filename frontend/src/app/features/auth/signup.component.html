<div class="mx-auto flex max-w-md flex-col rounded-3xl bg-slate-900 p-8 text-white shadow-sm">
  <h1 class="text-3xl font-semibold">Create account</h1>
  <p class="mt-2 text-slate-300">Sign up and start planning your next trip.</p>

  <form [formGroup]="signupForm" (ngSubmit)="signup()" class="mt-8 space-y-4">
    <div>
      <label class="block text-sm font-medium text-slate-200">Name</label>
      <input
        type="text"
        formControlName="name"
        class="mt-2 w-full rounded-2xl border border-slate-700 bg-slate-950 px-4 py-3 text-white focus:border-white focus:ring-2 focus:ring-slate-700" />
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-200">Email</label>
      <input
        type="email"
        formControlName="email"
        class="mt-2 w-full rounded-2xl border border-slate-700 bg-slate-950 px-4 py-3 text-white focus:border-white focus:ring-2 focus:ring-slate-700" />
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-200">Password</label>
      <input
        type="password"
        formControlName="password"
        class="mt-2 w-full rounded-2xl border border-slate-700 bg-slate-950 px-4 py-3 text-white focus:border-white focus:ring-2 focus:ring-slate-700" />
    </div>
    <button
      type="submit"
      [disabled]="loading"
      class="w-full rounded-2xl bg-white px-4 py-3 font-semibold text-slate-900 hover:bg-slate-100 disabled:opacity-60">
      Sign Up
    </button>
  </form>

  <p *ngIf="errorMessage" class="mt-4 rounded-2xl bg-red-500/10 px-4 py-3 text-sm text-red-200">{{ errorMessage }}</p>

  <p class="mt-8 text-center text-sm text-slate-300">
    Already have an account?
    <a routerLink="/auth" class="font-semibold text-white underline hover:no-underline">Sign in</a>
  </p>
</div>
