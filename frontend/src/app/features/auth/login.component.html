<div class="mx-auto flex max-w-md flex-col rounded-3xl bg-white p-8 shadow-sm">
  <h1 class="text-3xl font-semibold text-slate-900">Sign in</h1>
  <p class="mt-2 text-slate-500">Welcome back! Sign in to discover travel recommendations.</p>

  <form [formGroup]="loginForm" (ngSubmit)="login()" class="mt-8 space-y-4">
    <div>
      <label class="block text-sm font-medium text-slate-700">Email</label>
      <input
        type="email"
        formControlName="email"
        class="mt-2 w-full rounded-2xl border border-slate-300 px-4 py-3 focus:border-slate-900 focus:ring-2 focus:ring-slate-200" />
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700">Password</label>
      <input
        type="password"
        formControlName="password"
        class="mt-2 w-full rounded-2xl border border-slate-300 px-4 py-3 focus:border-slate-900 focus:ring-2 focus:ring-slate-200" />
    </div>
    <button
      type="submit"
      [disabled]="loading"
      class="w-full rounded-2xl bg-slate-900 px-4 py-3 text-white hover:bg-slate-700 disabled:opacity-60">
      Sign In
    </button>
  </form>

  <p *ngIf="errorMessage" class="mt-4 rounded-2xl bg-red-50 px-4 py-3 text-sm text-red-700">{{ errorMessage }}</p>

  <p class="mt-8 text-center text-sm text-slate-600">
    Don&apos;t have an account?
    <a routerLink="/auth/signup" class="font-semibold text-slate-900 underline hover:no-underline">Sign up</a>
  </p>
</div>
